[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gir"
version = "0.1.0"
description = "See what your AI coding agent actually changed: a behavior map of the diff, with proven problems pinned."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
gir = "gir.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["gir"]

[tool.setuptools.package-data]
gir = ["map.html"]
